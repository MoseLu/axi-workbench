# Axi Workbench — Windows reverse proxy (nginx) fallback template
#
# Use ONLY if the Caddy file in this directory cannot be deployed (for
# example, the Windows host already runs IIS on 80/443 and a sidecar
# Caddy is not acceptable). This file mirrors the Caddyfile 1:1 in
# observable behavior: HTTPS-only on 443, ACME-friendly 80, single
# upstream (the API Gateway on 127.0.0.1:18088), and a short, non-
# informative error surface.
#
# Every __REPLACE_ME__ placeholder must be supplied by a human operator.
# The TLS private key MUST NOT be committed to Git. Place the cert and
# key in C:\nginx\conf\ssl\ and grant the nginx service account read
# access only.
#
# Test:
#   nginx -t -c C:/nginx/conf/nginx.workbench.conf
#   nginx -s reload -c C:/nginx/conf/nginx.workbench.conf
#   curl.exe --fail-with-body https://workbench.axiomaticworld.com/health

worker_processes 2;
error_log  C:/nginx/logs/workbench.error.log warn;
pid        C:/nginx/logs/workbench.pid;

events {
    worker_connections 1024;
}

http {
    # -------------------------------------------------------------------------
    # Defaults
    # -------------------------------------------------------------------------
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    tcp_nopush    on;
    tcp_nodelay   on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;                          # do not leak nginx version

    # Reasonable client body cap to mirror Caddy's 25MB.
    client_max_body_size 25m;
    client_body_buffer_size 128k;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 8k;

    # Upstream: API Gateway on the host loopback. Healthcheck is the
    # /health route the Gateway already exposes.
    upstream axi_workbench_gateway {
        server 127.0.0.1:18088 max_fails=3 fail_timeout=10s;
        keepalive 16;
    }

    # Map short, non-informative error responses.
    map $status $axi_short_error {
        default "upstream unavailable";
        400     "bad request";
        502     "upstream unavailable";
        503     "upstream unavailable";
        504     "upstream unavailable";
    }

    # log_format is valid only in the http context, not inside server.
    log_format workbench '$remote_addr - $request_method "$request_uri" '
                         '$status $body_bytes_sent "$http_referer" '
                         '"$http_user_agent" rt=$request_time '
                         'urt=$upstream_response_time';

    # -------------------------------------------------------------------------
    # HTTP -> HTTPS redirect (port 80 reserved for ACME)
    # -------------------------------------------------------------------------
    server {
        listen       80;
        listen       [::]:80;
        server_name  workbench.axiomaticworld.com;

        # ACME challenge is the only thing allowed on HTTP. Anything else
        # is forced to HTTPS.
        location /.well-known/acme-challenge/ {
            root C:/nginx/acme;
        }
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # -------------------------------------------------------------------------
    # HTTPS
    # -------------------------------------------------------------------------
    server {
        listen       443 ssl;
        listen       [::]:443 ssl;
        http2        on;
        server_name  workbench.axiomaticworld.com;

        # --- TLS material ----------------------------------------------------
        # Replace the paths with the real locations on the Windows host.
        # The C: drive path must be readable by the nginx service account
        # only. NEVER commit ssl_certificate_key to Git.
        ssl_certificate     C:/nginx/conf/ssl/__REPLACE_ME_fullchain.pem;
        ssl_certificate_key C:/nginx/conf/ssl/__REPLACE_ME_privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
        ssl_prefer_server_ciphers off;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # --- Logging ---------------------------------------------------------
        access_log C:/nginx/logs/workbench.access.log workbench;

        # --- Health / ready short-circuit -----------------------------------
        # Caddy version also does this; mirrored here so the two templates
        # are equivalent in observable behavior.
        location = /health {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok";
        }
        location = /ready {
            access_log off;
            add_header Content-Type text/plain;
            return 200 "ok";
        }

        # --- API gateway proxy ----------------------------------------------
        location /api/ {
            proxy_pass         http://axi_workbench_gateway;
            proxy_http_version 1.1;
            proxy_set_header   Connection          "";
            proxy_set_header   Host                $host;
            proxy_set_header   X-Real-IP           $remote_addr;
            proxy_set_header   X-Forwarded-For     $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto   https;
            proxy_set_header   X-Forwarded-Host    $host;

            proxy_connect_timeout 5s;
            proxy_send_timeout    30s;
            proxy_read_timeout    30s;
            proxy_buffering       on;
            proxy_buffers         16 16k;
        }

        # --- Everything else -------------------------------------------------
        # The Workbench public origin serves only the API and the
        # desktop /health /ready probes. Anything else returns 404.
        location / {
            return 404;
        }

        # --- Generic error surface ------------------------------------------
        error_page 400 401 403 404 500 502 503 504 /__axi_err;
        location = /__axi_err {
            internal;
            default_type text/plain;
            return 502 $axi_short_error;
        }
    }
}
