[package]
name = "workbench-desktop"
version = "0.1.0"
description = "Axi Workbench Mac App"
authors = ["Axi Workbench Team"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "workbench_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-notification = "2"
once_cell = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# macOS 原生 NSWindow 桥接：登录窗隐藏全屏按钮（B 站形态只保留 2 颗交通灯）。
# Tauri 2 没有暴露 setShowsFullScreenButton，且 resizable=false 在某些 macOS
# 版本上仍会画出全屏按钮。这里用 objc2 直接调 NSWindow API，BOOL 用 i8 编码。
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5"
objc2-foundation = "0.3"
block2 = "0.5"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
