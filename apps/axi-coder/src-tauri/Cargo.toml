[package]
name = "axi-coder"
version = "0.2.0"
description = "Axi development workbench for AI coding CLIs"
authors = ["Axi Coder"]
edition = "2021"
rust-version = "1.85"

[lib]
name = "axi_coder_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4.0", features = [] }

[dependencies]
anyhow = "1.0"
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5.0"
http = "1.1"
keyring = "3.6"
portable-pty = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "default-tls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.8.5", features = [] }
thiserror = "2.0"
tokio = { version = "1.41", features = ["macros", "net", "rt-multi-thread", "sync"] }
tower = "0.5"
url = "2.5"
uuid = { version = "1.11", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3.14"
