<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#141414" />

    <!-- LCP preconnect: warm the api host before the React tree asks for
         `/api/...`. Same-origin (vite proxy in dev → gateway in prod)
         so no cross-origin dance. -->
    <!-- Observability ingest lives at /api/observability/ingest. Preconnect
         here lets the SDK batch posts start their TCP setup in parallel
         with HTML parsing, not after main.tsx's idle callback. -->

    <!-- LCP image preload: the Login page's QR-corner PNG is the largest
         contentful paint candidate (a small image, but it is the first
         thing that finishes painting after FCP). Preload it as an image
         so the request fires during HTML parse instead of waiting for
         React to mount the Login route. -->

    <!-- modulepreload lets the browser fetch main.tsx and its ESM
         dependency graph in parallel with the HTML parse. Vite dev mode
         does this automatically for prod builds; the explicit hint is
         cheap insurance and also helps when the dev server rewrites the
         script tag. -->

    <!-- Critical CSS inlined so first paint uses the dark page background
         and the page chrome does not white-flash. main.tsx still imports
         the full antd reset / axiom-ui stylesheet for components; in dev
         mode Vite re-injects them as <style> tags, which is safe because
         the inlined version only redefines `:root` vars and basic reset.
         The iconfont @font-face ships here too so the first iconsys-*
         glyph does not trigger a late font swap and re-LCP. Keep the
         inlined block small; it is intentionally the minimum needed for
         FCP. -->
    <style id="axi-critical-css">
      :root {
        --palette-gray-150: #ededed;
        --palette-gray-850: #191919;
        --palette-white: #fff;
        --palette-black: #000;
        --color-bg-page: var(--axi-bg-page, var(--palette-gray-150));
        --color-bg-chrome: var(--axi-layout-canvas, var(--palette-gray-150));
        --color-ink: var(--axi-text, var(--palette-gray-900));
        --color-ink-strong: var(--axi-text, var(--palette-gray-850));
        --axi-font-families: system-ui, -apple-system, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
      }
      html,
      body {
        width: 100%;
        height: 100%;
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html {
        -webkit-text-size-adjust: 100%;
        -webkit-tap-highlight-color: rgba(0, 0, 0, 0);
        font-family: var(--axi-font-families);
      }
      body {
        margin: 0;
        font-family: var(--axi-font-families);
        background: var(--color-bg-page);
        color: var(--color-ink-strong);
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      #root {
        height: 100%;
      }
      @font-face {
        font-family: "iconfont-sys";
        font-display: swap;
        src: url("/src/assets/icons/system/iconfont.woff2?t=1748252913866")
            format("woff2");
      }
    </style>

    <!-- Iconfont font preload. The @font-face above already declares the
         src, but `font-display: swap` means the browser only triggers
         the font request when a glyph is first laid out — by then the
         React tree may have committed. Preloading the woff2 here makes
         the request fire in parallel with the HTML parse so the swap
         does not delay text rendering. crossorigin is required for font
         preloads even on same-origin URLs. -->

    <title>公理工作台</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
