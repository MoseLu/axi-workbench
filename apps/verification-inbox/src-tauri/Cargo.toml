[package]
name = "axi-verification-inbox"
version = "0.1.0"
description = "Axi Verification Inbox"
authors = ["mose"]
license = "UNLICENSED"
edition = "2021"

[lib]
name = "imap_code_tool_lib"
crate-type = ["staticlib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-opener = "2"
