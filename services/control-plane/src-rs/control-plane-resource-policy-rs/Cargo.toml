[package]
name = "control-plane-resource-policy-rs"
version = "0.1.0"
edition = "2021"
description = "Resource policy kernel for the Axi Workstation control plane. Replaces evaluateGovernancePolicy, evaluateSurfaceExecutionPolicy and requirePolicyDecisionRef in src/control-plane.mjs."
license = "MIT OR Apache-2.0"
publish = false

[lib]
name = "control_plane_resource_policy_rs"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }