      additionalProperties: false
      properties:
        ok:
          type: boolean
          enum: [true]
        status:
          type: string
          enum: [approved, rejected, handed_off]
        handoffCorrelationId:
          type: string
        handoff:
          $ref: '#/components/schemas/HandoffContext'
        approval:
          type: object
          additionalProperties: true
