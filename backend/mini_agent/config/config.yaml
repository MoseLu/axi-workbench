# api_base: "https://api.minimax.io"   # Global 用户
api_base: "https://api.minimaxi.com"  # China 用户
model: "MiniMax-M2.5"
provider: "anthropic"

# ===== Retry Configuration =====
retry:
  enabled: true
  max_retries: 3
  initial_delay: 1.0
  max_delay: 60.0
  exponential_base: 2.0

# ===== Agent Configuration =====
max_steps: 100
workspace_dir: "./workspace"
system_prompt_path: "system_prompt.md"

# ===== Tools Configuration =====
tools:
  enable_file_tools: true
  enable_bash: true
  enable_note: true
  enable_skills: true
  skills_dir: "./skills"
  enable_mcp: true
  mcp_config_path: "mcp.json"
  mcp:
    connect_timeout: 10.0
    execute_timeout: 60.0
    sse_read_timeout: 120.0
