# Mini Agent Configuration
# =====
# MiniMax API Configuration
# api_key 必须从环境变量读取，真实 key 禁止写进本文件。
# 值来源：/Users/mose/credentials/api-keys.env 中的 MINIMAX_API_KEY（owner 管理，本仓库不修改）
# 未设置该变量时 mini_agent.config 会抛出明确错误，不会静默使用空值。
api_key: "${MINIMAX_API_KEY}"
# api_base: "https://api.minimax.io"   # Global 用户
api_base: "https://api.minimaxi.com"  # China 用户
model: "MiniMax-M2.5"
provider: "anthropic"

# ===== Retry Configuration =====
retry:
  enabled: true
  max_retries: 3
  initial_delay: 1.0
  max_delay: 60.0
  exponential_base: 2.0

# ===== Agent Configuration =====
max_steps: 100
workspace_dir: "./workspace"
system_prompt_path: "system_prompt.md"

# ===== Tools Configuration =====
tools:
  enable_file_tools: true
  enable_bash: true
  enable_note: true
  enable_skills: true
  skills_dir: "./skills"
  enable_mcp: true
  mcp_config_path: "mcp.json"
  mcp:
    connect_timeout: 10.0
    execute_timeout: 60.0
    sse_read_timeout: 120.0
