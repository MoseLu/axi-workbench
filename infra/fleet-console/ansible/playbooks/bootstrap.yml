---
- name: Bootstrap fleet baseline
  hosts: lifecycle_active
  become: true
  gather_facts: true
  gather_subset:
    - "!all"
    - "min"

  handlers:
    - name: Restart cockpit socket
      ansible.builtin.systemd:
        name: cockpit.socket
        state: restarted
        daemon_reload: true
      when: ansible_facts.service_mgr == "systemd"

    - name: Restart Netdata
      ansible.builtin.systemd:
        name: netdata
        state: restarted
      failed_when: false
      when: ansible_facts.service_mgr == "systemd"

  tasks:
    - name: Refresh apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
      when: ansible_facts.pkg_mgr == "apt"

    - name: Install baseline packages
      ansible.builtin.apt:
        name: "{{ fleet_base_packages_debian }}"
        state: present
      when: ansible_facts.pkg_mgr == "apt"

    - name: Install baseline packages on RedHat-like hosts
      ansible.builtin.package:
        name: "{{ fleet_base_packages_redhat }}"
        state: present
      when: ansible_facts.pkg_mgr in ["dnf", "yum"]

    - name: Enable systemd-timesyncd when present
      ansible.builtin.systemd:
        name: systemd-timesyncd
        enabled: true
        state: started
      failed_when: false
      when: ansible_facts.service_mgr == "systemd"

    - name: Check whether Tailscale is installed
      ansible.builtin.command: tailscale version
      changed_when: false
      failed_when: false
      register: tailscale_version
      when: fleet_enable_tailscale | bool

    - name: Install Tailscale on Debian-like hosts
      ansible.builtin.shell: curl -fsSL https://tailscale.com/install.sh | sh
      args:
        creates: /usr/bin/tailscale
      when:
        - fleet_enable_tailscale | bool
        - tailscale_version.rc != 0
        - ansible_facts.pkg_mgr == "apt"

    - name: Configure Tailscale yum repository on RedHat-like hosts
      ansible.builtin.get_url:
        url: "{{ fleet_tailscale_yum_repo_url }}"
        dest: /etc/yum.repos.d/tailscale.repo
        owner: root
        group: root
        mode: "0644"
      when:
        - fleet_enable_tailscale | bool
        - tailscale_version.rc != 0
        - ansible_facts.pkg_mgr in ["dnf", "yum"]

    - name: Install Tailscale on RedHat-like hosts
      ansible.builtin.package:
        name: tailscale
        state: present
      when:
        - fleet_enable_tailscale | bool
        - tailscale_version.rc != 0
        - ansible_facts.pkg_mgr in ["dnf", "yum"]

    - name: Check Tailscale binary after install attempt
      ansible.builtin.stat:
        path: /usr/bin/tailscale
      register: tailscale_binary
      when: fleet_enable_tailscale | bool

    - name: Enable tailscaled
      ansible.builtin.systemd:
        name: tailscaled
        enabled: true
        state: started
      when:
        - fleet_enable_tailscale | bool
        - tailscale_binary.stat.exists | default(false)
        - ansible_facts.service_mgr == "systemd"

    - name: Check Tailscale login state
      ansible.builtin.command: tailscale status --json
      changed_when: false
      failed_when: false
      register: tailscale_status
      when:
        - fleet_enable_tailscale | bool
        - tailscale_binary.stat.exists | default(false)

    - name: Join tailnet when an auth key is provided
      ansible.builtin.command: >
        tailscale up
        --auth-key={{ fleet_tailscale_authkey }}
        --hostname={{ inventory_hostname }}
        --accept-routes={{ fleet_tailscale_accept_routes | ternary('true', 'false') }}
        --ssh={{ fleet_tailscale_ssh | ternary('true', 'false') }}
      no_log: true
      when:
        - fleet_enable_tailscale | bool
        - tailscale_binary.stat.exists | default(false)
        - fleet_tailscale_authkey | length > 0
        - tailscale_status.rc != 0 or '"BackendState":"Running"' not in tailscale_status.stdout

    - name: Install Cockpit
      ansible.builtin.package:
        name: cockpit
        state: present
      when:
        - fleet_enable_cockpit | bool
        - ansible_facts.pkg_mgr in ["apt", "dnf", "yum"]

    - name: Create Cockpit socket override directory
      ansible.builtin.file:
        path: /etc/systemd/system/cockpit.socket.d
        state: directory
        owner: root
        group: root
        mode: "0755"
      when:
        - fleet_enable_cockpit | bool
        - ansible_facts.service_mgr == "systemd"

    - name: Bind Cockpit to the admin address
      ansible.builtin.copy:
        dest: /etc/systemd/system/cockpit.socket.d/listen.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          [Socket]
          ListenStream=
          ListenStream={{ fleet_cockpit_bind_address }}:9090
      notify: Restart cockpit socket
      when:
        - fleet_enable_cockpit | bool
        - ansible_facts.service_mgr == "systemd"

    - name: Enable Cockpit socket
      ansible.builtin.systemd:
        name: cockpit.socket
        enabled: true
        state: started
      when:
        - fleet_enable_cockpit | bool
        - ansible_facts.service_mgr == "systemd"

    - name: Check whether Netdata is installed
      ansible.builtin.command: netdata -v
      changed_when: false
      failed_when: false
      register: netdata_version
      when: fleet_enable_netdata | bool

    - name: Download Netdata kickstart
      ansible.builtin.get_url:
        url: https://get.netdata.cloud/kickstart.sh
        dest: /tmp/netdata-kickstart.sh
        mode: "0755"
      when:
        - fleet_enable_netdata | bool
        - netdata_version.rc != 0
        - ansible_facts.pkg_mgr == "apt"

    - name: Download Netdata repo config on RedHat-like hosts
      ansible.builtin.get_url:
        url: "{{ fleet_netdata_repo_config_rpm_url }}"
        dest: /tmp/netdata-repo.rpm
        mode: "0644"
      when:
        - fleet_enable_netdata | bool
        - netdata_version.rc != 0
        - ansible_facts.pkg_mgr in ["dnf", "yum"]

    - name: Ensure DNF vars directory exists for Netdata repo
      ansible.builtin.file:
        path: /etc/dnf/vars
        state: directory
        owner: root
        group: root
        mode: "0755"
      when:
        - fleet_enable_netdata | bool
        - netdata_version.rc != 0
        - ansible_facts.pkg_mgr in ["dnf", "yum"]

    - name: Set DNF major release variable for Netdata repo
      ansible.builtin.copy:
        dest: /etc/dnf/vars/releasever_major
        owner: root
        group: root
        mode: "0644"
        content: "{{ fleet_netdata_redhat_releasever_major }}"
      when:
        - fleet_enable_netdata | bool
        - netdata_version.rc != 0
        - ansible_facts.pkg_mgr in ["dnf", "yum"]

    - name: Check Netdata repo config package on RedHat-like hosts
      ansible.builtin.command: rpm -q netdata-repo
      changed_when: false
      failed_when: false
      register: netdata_repo_state
      when:
        - fleet_enable_netdata | bool
        - netdata_version.rc != 0
        - ansible_facts.pkg_mgr in ["dnf", "yum"]

    - name: Install Netdata repo config on RedHat-like hosts
      ansible.builtin.command: rpm -Uvh --nodeps /tmp/netdata-repo.rpm
      register: netdata_repo_install
      changed_when: netdata_repo_install.rc == 0
      when:
        - fleet_enable_netdata | bool
        - netdata_version.rc != 0
        - ansible_facts.pkg_mgr in ["dnf", "yum"]
        - netdata_repo_state.rc != 0

    - name: Install Netdata package on RedHat-like hosts
      ansible.builtin.dnf:
        name: netdata
        state: present
      register: netdata_redhat_install
      failed_when: not fleet_netdata_redhat_native_soft_fail | bool and netdata_redhat_install.rc | default(0) != 0
      when:
        - fleet_enable_netdata | bool
        - netdata_version.rc != 0
        - ansible_facts.pkg_mgr in ["dnf", "yum"]

    - name: Download Netdata kickstart for RedHat static fallback
      ansible.builtin.get_url:
        url: https://get.netdata.cloud/kickstart.sh
        dest: /tmp/netdata-kickstart.sh
        mode: "0755"
      when:
        - fleet_enable_netdata | bool
        - fleet_netdata_static_fallback | bool
        - netdata_redhat_install is defined
        - netdata_redhat_install.rc | default(0) != 0
        - ansible_facts.pkg_mgr in ["dnf", "yum"]

    - name: Install Netdata with static fallback on RedHat-like hosts
      ansible.builtin.command: >
        timeout {{ fleet_netdata_static_fallback_timeout }}
        sh /tmp/netdata-kickstart.sh
        --non-interactive
        --release-channel {{ fleet_netdata_release_channel }}
        --static-only
        {{ fleet_netdata_auto_update | ternary('--auto-update', '--no-updates') }}
      environment:
        DISABLE_TELEMETRY: "1"
      register: netdata_static_install
      failed_when: false
      when:
        - fleet_enable_netdata | bool
        - fleet_netdata_static_fallback | bool
        - netdata_redhat_install is defined
        - netdata_redhat_install.rc | default(0) != 0
        - ansible_facts.pkg_mgr in ["dnf", "yum"]

    - name: Report Netdata RedHat package compatibility issue
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }}: Netdata package install did not complete; OpenCloudOS/RHEL-compatible dependencies may be missing. Enable fleet_netdata_static_fallback after confirming GitHub release downloads are reachable."
      when:
        - fleet_enable_netdata | bool
        - fleet_netdata_redhat_native_soft_fail | bool
        - netdata_redhat_install is defined
        - netdata_redhat_install.rc | default(0) != 0
        - not fleet_netdata_static_fallback | bool

    - name: Install Netdata with kickstart on Debian-like hosts
      ansible.builtin.command: >
        sh /tmp/netdata-kickstart.sh
        --non-interactive
        --release-channel {{ fleet_netdata_release_channel }}
        {{ fleet_netdata_auto_update | ternary('--auto-update', '--no-updates') }}
        {{ (fleet_netdata_claim_token | length > 0) | ternary('--claim-token ' ~ fleet_netdata_claim_token, '') }}
        {{ (fleet_netdata_claim_rooms | length > 0) | ternary('--claim-rooms ' ~ fleet_netdata_claim_rooms, '') }}
        {{ (fleet_netdata_claim_token | length > 0) | ternary('--claim-url ' ~ fleet_netdata_claim_url, '') }}
      environment:
        DISABLE_TELEMETRY: "1"
      no_log: "{{ fleet_netdata_claim_token | length > 0 }}"
      when:
        - fleet_enable_netdata | bool
        - netdata_version.rc != 0
        - ansible_facts.pkg_mgr == "apt"

    - name: Check Netdata binary after install attempts
      ansible.builtin.command: netdata -v
      changed_when: false
      failed_when: false
      register: netdata_final_version
      when: fleet_enable_netdata | bool

    - name: Restrict Netdata web listener to the admin address
      ansible.builtin.blockinfile:
        path: /etc/netdata/netdata.conf
        create: true
        owner: root
        group: root
        mode: "0644"
        marker: "# {mark} ANSIBLE MANAGED FLEET WEB BIND"
        block: |
          [web]
            bind to = {{ fleet_netdata_bind_address }}
      notify: Restart Netdata
      when:
        - fleet_enable_netdata | bool
        - netdata_final_version.rc == 0

    - name: Enable Netdata service
      ansible.builtin.systemd:
        name: netdata
        enabled: true
        state: started
      when:
        - fleet_enable_netdata | bool
        - netdata_final_version.rc == 0
        - ansible_facts.service_mgr == "systemd"

    - name: Install Docker baseline on tagged hosts
      ansible.builtin.apt:
        name:
          - docker.io
          - docker-compose-v2
        state: present
      when:
        - fleet_enable_docker_baseline | bool
        - "'tag_docker' in group_names"
        - ansible_facts.os_family == "Debian"

    - name: Enable Docker on tagged hosts
      ansible.builtin.systemd:
        name: docker
        enabled: true
        state: started
      when:
        - fleet_enable_docker_baseline | bool
        - "'tag_docker' in group_names"
        - ansible_facts.service_mgr == "systemd"

    - name: Add SSH user to docker group on tagged hosts
      ansible.builtin.user:
        name: "{{ ansible_user }}"
        groups: docker
        append: true
      when:
        - fleet_enable_docker_baseline | bool
        - "'tag_docker' in group_names"
        - ansible_user != "root"
