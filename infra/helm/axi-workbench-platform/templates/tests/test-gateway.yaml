apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "axi-workbench-platform.fullname" . }}-gateway-test"
  labels:
    {{- include "axi-workbench-platform.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  restartPolicy: Never
  containers:
    - name: wget
      image: busybox:1.36
      command:
        - wget
        - --spider
        - --timeout=5
        - {{ printf "http://%s-gateway:%v/health" (include "axi-workbench-platform.fullname" .) .Values.gateway.service.port | quote }}
