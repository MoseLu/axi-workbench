{{- if .Values.podDisruptionBudget.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "axi-workbench-platform.fullname" . }}-gateway
  labels:
    {{- include "axi-workbench-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: gateway
spec:
  minAvailable: {{ .Values.podDisruptionBudget.minAvailable }}
  selector:
    matchLabels:
      {{- include "axi-workbench-platform.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: gateway
---
