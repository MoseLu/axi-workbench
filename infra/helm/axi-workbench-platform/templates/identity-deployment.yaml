apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "axi-workbench-platform.fullname" . }}-identity
  labels:
    {{- include "axi-workbench-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: identity-adapter
spec:
  replicas: {{ .Values.identityAdapter.replicaCount }}
  selector:
    matchLabels:
      {{- include "axi-workbench-platform.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: identity-adapter
  template:
    metadata:
      labels:
        {{- include "axi-workbench-platform.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: identity-adapter
    spec:
      serviceAccountName: {{ include "axi-workbench-platform.serviceAccountName" . }}
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: identity-adapter
          image: "{{ .Values.identityAdapter.image.repository }}:{{ default .Chart.AppVersion .Values.identityAdapter.image.tag }}"
          imagePullPolicy: {{ .Values.identityAdapter.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8081
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "axi-workbench-platform.fullname" . }}-config
          env:
            - name: IDENTITY_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret }}
                  key: IDENTITY_DATABASE_URL
            - name: IDENTITY_REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret }}
                  key: IDENTITY_REDIS_URL
            - name: IDENTITY_INTERNAL_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret }}
                  key: IDENTITY_INTERNAL_SERVICE_TOKEN
            - name: IDENTITY_EMAIL_VERIFICATION_PEPPER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret }}
                  key: IDENTITY_EMAIL_VERIFICATION_PEPPER
            - name: ZITADEL_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret }}
                  key: ZITADEL_WEBHOOK_SECRET
            - name: SMTP_HOST
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret }}
                  key: SMTP_HOST
            - name: SMTP_PORT
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret }}
                  key: SMTP_PORT
            - name: SMTP_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret }}
                  key: SMTP_USERNAME
            - name: SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret }}
                  key: SMTP_PASSWORD
            - name: SMTP_FROM
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret }}
                  key: SMTP_FROM
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            {{- toYaml .Values.identityAdapter.resources | nindent 12 }}
