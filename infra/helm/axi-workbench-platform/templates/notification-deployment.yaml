apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "axi-workbench-platform.fullname" . }}-notification
  labels:
    {{- include "axi-workbench-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: notification-service
spec:
  replicas: {{ .Values.notificationService.replicaCount }}
  selector:
    matchLabels:
      {{- include "axi-workbench-platform.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: notification-service
  template:
    metadata:
      labels:
        {{- include "axi-workbench-platform.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: notification-service
    spec:
      serviceAccountName: {{ include "axi-workbench-platform.serviceAccountName" . }}
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: notification-service
          image: "{{ .Values.notificationService.image.repository }}:{{ default .Chart.AppVersion .Values.notificationService.image.tag }}"
          imagePullPolicy: {{ .Values.notificationService.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8084
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "axi-workbench-platform.fullname" . }}-config
          env:
            - name: NOTIFICATION_INTERNAL_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret }}
                  key: NOTIFICATION_INTERNAL_SERVICE_TOKEN
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            {{- toYaml .Values.notificationService.resources | nindent 12 }}
