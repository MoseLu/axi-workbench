{{- if .Values.migrations.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "axi-workbench-platform.fullname" . }}-identity-migrate
  labels:
    {{- include "axi-workbench-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: identity-migration
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-20"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.migrations.backoffLimit }}
  ttlSecondsAfterFinished: {{ .Values.migrations.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        {{- include "axi-workbench-platform.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: identity-migration
    spec:
      restartPolicy: OnFailure
      serviceAccountName: {{ include "axi-workbench-platform.serviceAccountName" . }}
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: identity-migrate
          image: "{{ .Values.identityAdapter.image.repository }}:{{ default .Chart.AppVersion .Values.identityAdapter.image.tag }}"
          imagePullPolicy: {{ .Values.identityAdapter.image.pullPolicy }}
          command: ["/identity-migrate"]
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          envFrom:
            - configMapRef:
                name: {{ include "axi-workbench-platform.fullname" . }}-config
          env:
            - name: IDENTITY_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret }}
                  key: IDENTITY_DATABASE_URL
            - name: IDENTITY_REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret }}
                  key: IDENTITY_REDIS_URL
            - name: IDENTITY_INTERNAL_SERVICE_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret }}
                  key: IDENTITY_INTERNAL_SERVICE_TOKEN
            - name: ZITADEL_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret }}
                  key: ZITADEL_WEBHOOK_SECRET
            - name: SMTP_HOST
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret }}
                  key: SMTP_HOST
            - name: SMTP_PORT
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret }}
                  key: SMTP_PORT
            - name: SMTP_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret }}
                  key: SMTP_USERNAME
            - name: SMTP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret }}
                  key: SMTP_PASSWORD
            - name: SMTP_FROM
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret }}
                  key: SMTP_FROM
---
